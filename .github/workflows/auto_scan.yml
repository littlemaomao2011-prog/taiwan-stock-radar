name: 台股 666 自動精選雷達

on:
  workflow_dispatch:
  schedule:
    # 依需求設定定時任務 (目前設定：台灣時間盤中 09:30 與盤後 14:00 執行)
    - cron: '30 1 * * 1-5'
    - cron: '0 6 * * 1-5'

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
      - name: 複製儲存庫代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 初始化 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝所需 Python 套件
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy yfinance lxml

      - name: 🚀 執行台股 666 精選雷達
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner_rising_point.py
